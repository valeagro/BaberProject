<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbearia Jotapê Cortes</title>
    <style>
        :root { --primary-color: #d4af37; --bg-dark: #121212; --bg-light: #1e1e1e; --text-light: #f5f5f5; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); }
        section { padding: 3rem 5%; }
        h1, h2 { color: var(--primary-color); text-align: center; margin-bottom: 2rem; }
        .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 2rem; margin-bottom: 2rem;}
        .service-card { background-color: var(--bg-light); padding: 2rem; border-radius: 8px; text-align: center; border: 1px solid #333; }
        .booking-container { max-width: 600px; margin: 0 auto; background-color: var(--bg-light); padding: 2rem; border-radius: 8px; }
        .form-group { margin-bottom: 1.5rem; }
        .form-control { width: 100%; padding: 10px; background: var(--bg-dark); border: 1px solid #444; color: white; border-radius: 4px; }
        .btn { width: 100%; padding: 12px; background: var(--primary-color); border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <section id="servicos">
        <h2>Nossos Serviços</h2>
        <div class="services-grid" id="servicesGrid">Carregando serviços...</div>
    </section>

    <section id="agendamento">
        <h2>Agende seu Horário</h2>
        <div class="booking-container">
            <form id="bookingForm">
                <div class="form-group">
                    <label>Nome Completo</label>
                    <input type="text" id="nome" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Serviço</label>
                    <select id="servico" class="form-control" required></select>
                </div>
                <div class="form-group">
                    <label>Data</label>
                    <input type="date" id="data" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Horário</label>
                    <select id="hora" class="form-control" required>
                        <option value="">Selecione uma data primeiro</option>
                    </select>
                </div>
                <button type="submit" class="btn">Confirmar Agendamento</button>
            </form>
        </div>
    </section>

    <script>
        const API_URL = '/api';

        async function carregarServicos() {
            const res = await fetch(`${API_URL}/servicos`);
            const servicos = await res.json();
            const grid = document.getElementById('servicesGrid');
            const select = document.getElementById('servico');
            grid.innerHTML = '';
            select.innerHTML = '<option value="">Selecione...</option>';

            servicos.forEach(s => {
                grid.innerHTML += `<div class="service-card"><h3>${s.nome}</h3><p>R$ ${s.preco.toFixed(2)}</p></div>`;
                select.innerHTML += `<option value="${s.id}">${s.nome}</option>`;
            });
        }

        document.getElementById('data').addEventListener('change', async (e) => {
            const data = e.target.value;
            const res = await fetch(`${API_URL}/horarios-disponiveis?data=${data}`);
            const horarios = await res.json();
            const select = document.getElementById('hora');
            select.innerHTML = '<option value="">Selecione o horário</option>';
            horarios.forEach(h => select.innerHTML += `<option value="${h}">${h}</option>`);
        });

        document.getElementById('bookingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const dados = {
                nome: document.getElementById('nome').value,
                servicoId: document.getElementById('servico').value,
                data: document.getElementById('data').value,
                hora: document.getElementById('hora').value
            };
            const res = await fetch(`${API_URL}/agendamentos`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });
            if (res.ok) {
                alert('Agendamento confirmado com sucesso!');
                e.target.reset();
                document.getElementById('hora').innerHTML = '<option value="">Selecione uma data primeiro</option>';
            } else {
                alert('Erro ao agendar. Tente outro horário.');
            }
        });

        // Configura data mínima e inicia
        document.getElementById('data').min = new Date().toISOString().split('T')[0];
        carregarServicos();
    </script>
</body>
</html>
