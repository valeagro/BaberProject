<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - Jotapê</title>
    <style>
        :root { --primary-color: #d4af37; --bg-dark: #121212; --bg-light: #1e1e1e; --text-light: #f5f5f5; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); padding: 2rem; }
        .container { max-width: 900px; margin: 0 auto; display: grid; gap: 2rem; }
        .card { background: var(--bg-light); padding: 2rem; border-radius: 8px; border: 1px solid #333; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #333; }
        th { color: var(--primary-color); }
        .btn { padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; color: white; }
        .btn-danger { background: #ff4444; }
        .btn-success { background: #00C851; margin-top: 10px; }
        input { width: 100%; padding: 8px; background: var(--bg-dark); border: 1px solid #444; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>Agendamentos Ativos <button onclick="carregarAgendamentos()" style="margin-left:15px; cursor:pointer;">🔄 Atualizar</button></h2>
            <table>
                <thead><tr><th>Cliente</th><th>Data</th><th>Hora</th><th>Ação</th></tr></thead>
                <tbody id="lista-agendamentos"></tbody>
            </table>
        </div>
    </div>

    <script>
        const API_URL = '/api';

        async function carregarAgendamentos() {
            try {
                // Adicionado ?v= para impedir cache do navegador
                const res = await fetch(`${API_URL}/agendamentos?v=${new Date().getTime()}`);
                const agendamentos = await res.json();
                const tbody = document.getElementById('lista-agendamentos');
                tbody.innerHTML = '';
                agendamentos.forEach(ag => {
                    const dataFormatada = ag.data ? ag.data.split('-').reverse().join('/') : 'Erro na data';
                    tbody.innerHTML += `
                        <tr>
                            <td>${ag.nome}</td>
                            <td>${dataFormatada}</td>
                            <td>${ag.hora}</td>
                            <td><button class="btn btn-danger" onclick="cancelarAgendamento(${ag.id})">Cancelar</button></td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error("Erro ao carregar:", error);
            }
        }

        async function cancelarAgendamento(id) {
            if(confirm('Cancelar agendamento?')) {
                await fetch(`${API_URL}/agendamentos/${id}`, { method: 'DELETE' });
                carregarAgendamentos();
            }
        }

        carregarAgendamentos();
    </script>
</body>
</html>
